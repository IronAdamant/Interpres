[package]
name = "interpres"
version = "0.2.0"
edition = "2021"
description = "Local companion that saves Windows and macOS Live Captions as dated session transcripts"
license = "MIT OR Apache-2.0"
authors = ["Interpres Contributors"]
repository = "https://github.com/IronAdamant/Interpres"
readme = "README.md"
keywords = ["live-captions", "accessibility", "deaf", "transcript", "offline"]
categories = ["accessibility", "command-line-utilities"]

# Strict zero crates.io dependencies. Native Mac UI is AppKit via system clang (build.rs).
[dependencies]

[dev-dependencies]

[lib]
name = "interpres"
path = "src/lib.rs"

[[bin]]
name = "interpres"
path = "src/main.rs"
